<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Stratos Rental Property</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light" style="background-image: url(images/Gemini_Generated_Image_c7j5ugc7j5ugc7j5.png); background-size: cover;">

    <div class="container mt-5">

        <div class="card shadow mx-auto" style="width: 500px;">

            <div class="card-header text-center bg-success text-white">
                <h2>Create Account</h2>
            </div>

            <div class="card-body">

                <form>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="Enter Full Name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="Enter Email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" placeholder="Enter Phone Number">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" placeholder="Create Username">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" placeholder="Create Password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" placeholder="Confirm Password">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">
                            Sign Up
                        </button>
                    </div>

                </form>

            </div>

            <div class="card-footer text-center">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </div>

</body>
</html>
